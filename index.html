
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Accelera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.process = { env: { API_KEY: "" } };
      
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                900: '#111827',
                800: '#1f2937',
                700: '#374151',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.2s ease-out forwards',
              'grow': 'grow 0.3s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(4px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              grow: {
                '0%': { opacity: '0', transform: 'scale(0.95) translateY(10px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      .form-input, .form-select { 
        display: block; 
        width: 100%; 
        border-radius: 0.5rem; 
        border: 1px solid #e5e7eb; 
        padding: 0.625rem; 
        background-color: #fff; 
        color: #111827; 
      }
      .dark .form-input, .dark .form-select { 
        background-color: #374151; 
        border-color: #4b5563; 
        color: #f3f4f6; 
      }
      .table-zebrado tbody tr:nth-child(even) {
        background-color: rgba(249, 250, 251, 1);
      }
      .dark .table-zebrado tbody tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.03);
      }
      /* Hover mais escuro e perceptível */
      .table-zebrado tbody tr:hover {
        background-color: rgba(219, 234, 254, 1) !important; /* Blue 100 */
        cursor: pointer;
      }
      .dark .table-zebrado tbody tr:hover {
        background-color: rgba(30, 58, 138, 0.5) !important; /* Mais opaco em dark mode */
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      body { margin: 0; padding: 0; overflow: hidden; background-color: #f9fafb; }
      .dark body { background-color: #111827; }
      #root { height: 100vh; width: 100vw; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
